[package]
name = "lemon-bitcrusher"
description = "Lemon Bitcrusher: Lemon Studio's bit depth reduction, sample decimator, and overdrive saturation plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
test = false

[features]
# Compiled into Lemon Studio: no exported plugin entry points (they would clash with the other built-in plugins).
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-fx = { path = "../lemon-small-fx" }
os-plugkit = { path = "../../crates/os-plugkit" }
